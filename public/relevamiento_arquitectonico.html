<script id="gasv-enhancements-v4">
(()=>{
  'use strict';
  const ENH='__GASV_ENHANCEMENTS_V4__';
  if(window[ENH]) return;

  const qs=(s,r=document)=>r.querySelector(s);
  const qsa=(s,r=document)=>Array.from(r.querySelectorAll(s));
  const textOf=e=>String(e?.textContent||'').trim();
  const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const safeName=v=>String(v||'Proyecto_relevamiento').trim().replace(/[\\/:*?"<>|]+/g,'_').replace(/\s+/g,'_').replace(/_+/g,'_').slice(0,90)||'Proyecto_relevamiento';
  const n=v=>{const x=parseFloat(String(v??'').replace(',','.'));return Number.isFinite(x)?x:0};
  const areaOf=f=>f?.geometria==='irregular'?n(f.areaDirecta):n(f.largo)*n(f.ancho);
  const blockOf=(f,p)=>String(f?.bloque||p?.bloque||'Sin bloque').trim()||'Sin bloque';
  const stamp=()=>{const d=new Date(),p=x=>String(x).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}_${p(d.getHours())}-${p(d.getMinutes())}-${p(d.getSeconds())}`};

  async function readState(){
    const st=window.__GASV_STORAGE__;
    if(!st) throw new Error('Almacenamiento de GASV no disponible.');
    await st.ready();
    const [f,p,c]=await Promise.all([st.getItem('fichas'),st.getItem('projectData'),st.getItem('catalogosPersonalizados')]);
    return {fichas:Array.isArray(f)?f:[],projectData:p&&typeof p==='object'?p:{},catalogosPersonalizados:c&&typeof c==='object'?c:{}};
  }

  function groupAreas(state){
    const map={};
    for(const f of state.fichas||[]){
      const b=blockOf(f,state.projectData);
      map[b]=(map[b]||0)+areaOf(f);
    }
    return Object.entries(map).sort((a,b)=>b[1]-a[1]);
  }

  function chartHtml(state, compact=false){
    const data=groupAreas(state);
    const total=data.reduce((s,[,v])=>s+v,0);
    const max=Math.max(0,...data.map(([,v])=>v));
    if(!data.length) return `<div class="gasv-enh-chart-card"><div class="gasv-enh-title">Distribución de áreas por bloque</div><div class="gasv-enh-sub">Aún no existen ambientes guardados para graficar.</div></div>`;
    return `<div class="gasv-enh-chart-card${compact?' gasv-enh-compact':''}">
      <div class="gasv-enh-title">Distribución de áreas por bloque</div>
      <div class="gasv-enh-sub">Superficie acumulada según el bloque asignado a cada ambiente.</div>
      <div class="gasv-enh-chart">${data.map(([b,v])=>`<div class="gasv-enh-bar-row">
        <div class="gasv-enh-bar-label" title="${esc(b)}">${esc(b)}</div>
        <div class="gasv-enh-bar-track"><div class="gasv-enh-bar" style="width:${max?Math.max(2,v/max*100):2}%"></div></div>
        <div class="gasv-enh-bar-value">${v.toFixed(2)} m²</div>
      </div>`).join('')}</div>
      <div class="gasv-enh-chart-total">Área total: <strong>${total.toFixed(2)} m²</strong> · Bloques: <strong>${data.length}</strong></div>
    </div>`;
  }

  async function ensureMainChart(){
    const heading=qsa('h2,h3').find(h=>textOf(h).startsWith('Ambientes del Proyecto'));
    if(!heading) return;
    const table=heading.closest('div')?.querySelector('table') || heading.closest('section')?.querySelector('table');
    if(!table) return;
    const wrap=table.parentElement?.parentElement || table.parentElement;
    if(!wrap) return;
    let state;
    try{state=await readState()}catch{return}
    const parent=wrap.parentElement||wrap;
    let card=qs('[data-gasv-area-chart]',parent);
    const sig=JSON.stringify(groupAreas(state));
    if(card){
      if(card.dataset.gasvChartSig!==sig){card.innerHTML=chartHtml(state);card.dataset.gasvChartSig=sig}
      return;
    }
    card=document.createElement('div');
    card.setAttribute('data-gasv-area-chart','1');
    card.dataset.gasvChartSig=sig;
    card.innerHTML=chartHtml(state);
    parent.appendChild(card);
  }

  function drawerHost(){
    const h=qsa('h2').find(x=>textOf(x)==='Fichas Guardadas');
    if(!h) return null;
    return h.closest('.fixed') || h.closest('[class*="fixed"]');
  }

  function applyDrawerFilter(host,query,block){
    const q=String(query||'').trim().toLowerCase();
    const b=String(block||'').trim().toLowerCase();
    const buttons=qsa('button',host).filter(x=>textOf(x)==='Cargar');
    let visible=0;
    for(const btn of buttons){
      const card=btn.parentElement?.parentElement;
      if(!card) continue;
      const hay=textOf(card).toLowerCase();
      const matchQ=!q||hay.includes(q);
      const matchB=!b||hay.includes(b);
      card.style.display=(matchQ&&matchB)?'':'none';
      if(matchQ&&matchB) visible++;
    }
    const empty=qs('[data-gasv-drawer-empty-filter]',host);

  async function ensureDrawerSearch(){

    if(qs('[data-gasv-drawer-search]',host)){
      applyDrawerFilter(host,window.__GASV_DRAWER_QUERY__||'',window.__GASV_DRAWER_BLOCK__||'');

    if(!h) return;
    const header=h.parentElement;
    if(!header) return;
    const box=document.createElement('div');
    box.className='px-4 pt-3 pb-1 bg-white border-b border-slate-100';
    box.setAttribute('data-gasv-drawer-search','1');

      <div style="flex:1;min-width:220px"><input class="gasv-enh-input" data-gasv-drawer-query placeholder="Buscar por código, ambiente o bloque..." value="${esc(window.__GASV_DRAWER_QUERY__||'')}"></div>

    </div>
    <div data-gasv-drawer-empty-filter class="text-xs text-slate-500 italic py-2"></div>`;

      for(const b of blocks){const o=document.createElement('option');o.value=b;o.textContent=b;sel.appendChild(o)}
      sel.value=window.__GASV_DRAWER_BLOCK__||'';
    }
    qs('[data-gasv-drawer-query]',box)?.addEventListener('input',e=>{
      window.__GASV_DRAWER_QUERY__=e.target.value; applyDrawerFilter(host,e.target.value,window.__GASV_DRAWER_BLOCK__||'');
    });
    qs('[data-gasv-drawer-block]',box)?.addEventListener('change',e=>{
      window.__GASV_DRAWER_BLOCK__=e.target.value; applyDrawerFilter(host,window.__GASV_DRAWER_QUERY__||'',e.target.value);
    });

  let pdfModal=null;

  function openPdfSelector(){
    if(pdfModal){pdfModal.remove();pdfModal=null}
    readState().then(state=>{
      const fichas=[...(state.fichas||[])].sort((a,b)=>String(a.codigo||a.ambiente||'').localeCompare(String(b.codigo||b.ambiente||'')));
      if(!fichas.length){alert('No hay ambientes guardados para exportar.');return}
      const currentRadio=qs('input[name="ambsel"]:checked');
      const currentCode=currentRadio?.closest('tr') ? String(currentRadio.closest('tr').cells?.[1]?.textContent||'').trim() : '';
      const initial=new Set(currentCode?fichas.filter(f=>String(f.codigo||'').trim()===currentCode).map(f=>f.id):[]);
      pdfModal=document.createElement('div');
      pdfModal.className='gasv-enh-modal gasv-enh-no-print';
      pdfModal.innerHTML=`<div class="gasv-enh-modal-box">
        <div class="gasv-enh-modal-head"><h2>Exportar PDF · Selección de ambientes</h2><button type="button" data-pdf-close>×</button></div>
        <div class="gasv-enh-modal-body">
          <div class="gasv-enh-sub" style="margin-bottom:10px">Seleccione las fichas que formarán parte del reporte técnico. El documento incluirá los datos del proyecto, el resumen de áreas por bloque y el detalle de cada ambiente seleccionado.</div>
          <div class="gasv-enh-selection-tools">
            <input class="gasv-enh-input" data-pdf-query placeholder="Buscar por código, ambiente o bloque...">
            <button class="gasv-enh-btn gasv-enh-gray" data-pdf-all>Seleccionar visibles</button>
            <button class="gasv-enh-btn gasv-enh-outline" data-pdf-none>Limpiar selección</button>
          </div>
          <div class="gasv-enh-list" data-pdf-list></div>
        </div>
        <div class="gasv-enh-modal-foot">
          <div class="text-xs text-slate-500"><strong data-pdf-count>0</strong> ambiente(s) seleccionado(s)</div>
          <div class="gasv-enh-row"><button class="gasv-enh-btn gasv-enh-gray" data-pdf-close>Cancelar</button><button class="gasv-enh-btn gasv-enh-blue" data-pdf-generate>Generar reporte PDF</button></div>
        </div>
      </div>`;
      document.body.appendChild(pdfModal);
      const list=qs('[data-pdf-list]',pdfModal);
      const renderList=()=>{
        const q=String(qs('[data-pdf-query]',pdfModal)?.value||'').trim().toLowerCase();
        list.innerHTML='';
        let visible=0;
        for(const f of fichas){
          const hay=`${f.codigo||''} ${f.ambiente||''} ${blockOf(f,state.projectData)} ${f.nivel||''}`.toLowerCase();
          if(q&&!hay.includes(q)) continue;
          visible++;
          const checked=initial.has(f.id);
          const card=document.createElement('div');
          card.className='gasv-enh-select-card'+(checked?' selected':'');
          card.innerHTML=`<label><input type="checkbox" data-pdf-id="${esc(f.id)}" ${checked?'checked':''}>
            <div><div class="gasv-enh-select-main">${esc(f.codigo||'S/C')} · ${esc(f.ambiente||'Sin nombre')}</div>
            <div class="gasv-enh-select-meta">${esc(blockOf(f,state.projectData))} · Nivel ${esc(f.nivel||'—')} · ${areaOf(f).toFixed(2)} m² · ${esc(f.diagestado||'Regular')}</div></div></label>`;
          list.appendChild(card);
          const input=qs('input',card);
          input.addEventListener('change',()=>{if(input.checked)initial.add(f.id);else initial.delete(f.id);card.classList.toggle('selected',input.checked);updateCount()});
        }
        if(!visible) list.innerHTML='<div class="gasv-enh-sub">No hay ambientes que coincidan con el filtro.</div>';
        updateCount();
      };
      const updateCount=()=>{const e=qs('[data-pdf-count]',pdfModal);if(e)e.textContent=String(initial.size)};
      qs('[data-pdf-query]',pdfModal)?.addEventListener('input',renderList);
      qs('[data-pdf-all]',pdfModal)?.addEventListener('click',()=>{const q=String(qs('[data-pdf-query]',pdfModal)?.value||'').trim().toLowerCase();fichas.forEach(f=>{const hay=`${f.codigo||''} ${f.ambiente||''} ${blockOf(f,state.projectData)} ${f.nivel||''}`.toLowerCase();if(!q||hay.includes(q))initial.add(f.id)});renderList()});
      qs('[data-pdf-none]',pdfModal)?.addEventListener('click',()=>{initial.clear();renderList()});
      qsa('[data-pdf-close]',pdfModal).forEach(b=>b.addEventListener('click',()=>{pdfModal?.remove();pdfModal=null}));
      qs('[data-pdf-generate]',pdfModal)?.addEventListener('click',()=>{
        const sel=fichas.filter(f=>initial.has(f.id));
        if(!sel.length){alert('Seleccione al menos un ambiente.');return}
        pdfModal.remove();pdfModal=null;
        generateTechnicalPdf(state,sel);
      });
      renderList();
    }).catch(e=>alert(e.message||String(e)));
  }

  function gasvNormalize(v){
    return String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
  }
  function gasvWords(v){ return String(v||'').trim().split(/\s+/).filter(Boolean).length; }
  function gasvLimit(text,max=100){
    const words=String(text||'').trim().split(/\s+/).filter(Boolean);
    if(words.length<=max) return words.join(' ');
    return words.slice(0,max).join(' ').replace(/[;,.:\s]+$/,'')+'.';
  }
  function gasvSection(title){
    const h=qsa('h2').find(x=>gasvNormalize(textOf(x))===gasvNormalize(title));
    return h ? (h.closest('.print-card') || h.parentElement || null) : null;
  }
  function gasvFieldByLabel(section,label){
    if(!section) return null;
    const target=gasvNormalize(label);
    const lab=qsa('label',section).find(x=>gasvNormalize(textOf(x))===target);
    return lab?.parentElement?.querySelector('input,select,textarea') || null;
  }
  function gasvSetValue(el,value){
    if(!el) return false;
    let proto=HTMLInputElement.prototype;
    if(el instanceof HTMLTextAreaElement) proto=HTMLTextAreaElement.prototype;
    else if(el instanceof HTMLSelectElement) proto=HTMLSelectElement.prototype;
    const setter=Object.getOwnPropertyDescriptor(proto,'value')?.set;
    if(setter) setter.call(el,String(value??'')); else el.value=String(value??'');
    el.dispatchEvent(new Event('input',{bubbles:true}));
    el.dispatchEvent(new Event('change',{bubbles:true}));
    return true;
  }
  function gasvTableRows(section){
    if(!section) return [];
    const headers=Array.from(section.querySelectorAll('thead th')).map(th=>gasvNormalize(textOf(th)));
    return Array.from(section.querySelectorAll('tbody tr')).map(tr=>{
      const row={};
      const cells=Array.from(tr.children).filter(el=>el.tagName==='TD');
      cells.forEach((cell,i)=>{
        const key=headers[i]||`col${i}`;
        const field=cell.querySelector('input,select,textarea');
        row[key]=field ? String(field.value||'').trim() : String(cell.textContent||'').trim();
      });
      return row;
    }).filter(row=>Object.values(row).some(v=>String(v||'').trim()));
  }
  function gasvVisiblePatologias(){
    const section=gasvSection('7. Patologías y deficiencias');
    return gasvTableRows(section).map(row=>({
      elemento: row[gasvNormalize('Elemento afectado')]||'',
      patologia: row[gasvNormalize('Patología / deficiencia')]||'',
      ubicacion: row[gasvNormalize('Ubicación')]||'',
      cantidad: row[gasvNormalize('Cantidad')]||'',
      unidad: row[gasvNormalize('Unidad')]||'',
      severidad: row[gasvNormalize('Severidad')]||'',
      intervencion: row[gasvNormalize('Intervención recomendada')]||''
    })).filter(x=>x.elemento||x.patologia||x.ubicacion);
  }
  async function gasvCurrentFicha(){
    try{
      const state=await readState();
      const sec=gasvSection('1. Datos generales');
      const code=gasvFieldByLabel(sec,'Código')?.value?.trim();
      const amb=gasvFieldByLabel(sec,'Ambiente / Área')?.value?.trim();
      let f=(state.fichas||[]).find(x=>code&&String(x.codigo||'').trim()===code);
      if(!f&&amb) f=(state.fichas||[]).find(x=>String(x.ambiente||'').trim()===amb);
      return {state,f};

  }
  function gasvDimensionalText(){
    const sec=gasvSection('2. Levantamiento dimensional');

    const geo=gasvFieldByLabel(sec,'Tipo de geometría')?.value||'regular';
    const largo=gasvFieldByLabel(sec,'Largo (m)')?.value;
    const ancho=gasvFieldByLabel(sec,'Ancho (m)')?.value;
    const areaDirecta=gasvFieldByLabel(sec,'Área del ambiente (m²)')?.value;
    const altura=gasvFieldByLabel(sec,'Altura libre (m)')?.value;
    const area=gasvFieldByLabel(sec,'Área registrada (m²)')?.value;
    const per=gasvFieldByLabel(sec,'Perímetro calculado (m)')?.value;
    const estado=gasvFieldByLabel(sec,'Estado general')?.value||'Regular';
    const obs=gasvFieldByLabel(sec,'Observaciones')?.value?.trim();
    const tipo=gasvNormalize(geo)==='irregular'?'irregular':'regular';
    let t='El ambiente presenta una geometría '+tipo;
    if(tipo==='regular' && largo && ancho) t+=`, con ${largo} m de largo por ${ancho} m de ancho`;
    if(tipo==='irregular' && areaDirecta) t+=`, con un área registrada de ${areaDirecta} m²`;
    if(altura) t+=`, y una altura libre de ${altura} m`;
    if(area && area!=='0.00') t+=`, con un área calculada de ${area} m²`;
    if(per && per!=='0.00') t+=` y un perímetro calculado de ${per} m`;
    t+=`. El estado dimensional registrado es ${String(estado).toLowerCase()}.`;
    if(obs) t+=` ${obs}`;
    return gasvLimit(t,100);
  }
  function gasvDiagnosisText(ctx){
    const {f}=ctx;
    const sec=gasvSection('10. Diagnóstico preliminar');
    const estado=gasvFieldByLabel(sec,'Estado')?.value||f?.diagestado||'Regular';
    const interv=gasvFieldByLabel(sec,'Intervención')?.value||f?.interv||'Mantenimiento correctivo';
    const visiblePats=gasvVisiblePatologias();
    const storedPats=Array.isArray(f?.pat)?f.pat.filter(x=>x&&(x.elemento||x.patologia)):[];
    const pats=visiblePats.length?visiblePats:storedPats;
    const sev={Crítica:0,Severa:0,Moderada:0,Leve:0};
    pats.forEach(x=>{ if(sev[x.severidad]!==undefined) sev[x.severidad]++; });
    const elements=[...new Set(pats.map(x=>String(x.elemento||'').trim()).filter(Boolean))];
    let t=`El ambiente se clasifica en estado ${String(estado).toLowerCase()} y requiere ${String(interv).toLowerCase()}.`;
    if(pats.length){
      t+=` Se registraron ${pats.length} deficiencia${pats.length===1?'':'s'}${elements.length?` en ${elements.slice(0,3).join(', ')}`:''}.`;
      const sevText=Object.entries(sev).filter(([,v])=>v).map(([k,v])=>`${v} de severidad ${k.toLowerCase()}`).join(', ');
      if(sevText) t+=` La valoración corresponde a ${sevText}.`;
      const actions=[...new Set(pats.map(x=>String(x.intervencion||'').trim()).filter(Boolean))];
      if(actions.length) t+=` Las acciones consignadas incluyen ${actions.slice(0,3).join(', ').toLowerCase()}.`;

    return gasvLimit(t,100);
  }
  function gasvGeneralText(ctx){
    const {f}=ctx;

    const sec10=gasvSection('10. Diagnóstico preliminar');
    const estado=gasvFieldByLabel(sec10,'Estado')?.value||f?.diagestado||gasvFieldByLabel(sec2,'Estado general')?.value||'Regular';
    const interv=gasvFieldByLabel(sec10,'Intervención')?.value||f?.interv||'Mantenimiento correctivo';
    const visiblePats=gasvVisiblePatologias();
    const storedPats=Array.isArray(f?.pat)?f.pat.filter(x=>x&&(x.elemento||x.patologia)):[];

    const fotosVisible=photoSection?photoSection.querySelectorAll('img').length:0;
    const fotos= f?.fotos?.length || fotosVisible || 0;
    const cuanSection=gasvSection('8. Cuantificación preliminar');
    const cuanVisible=gasvTableRows(cuanSection).filter(x=>x[gasvNormalize('Trabajo a ejecutar')]||x[gasvNormalize('Elemento')]).length;

    t+=` La intervención prevista corresponde a ${String(interv).toLowerCase()}.`;
    if(fotos) t+=` El registro fotográfico incluye ${fotos} imagen${fotos===1?'':'es'}.`;
    t+=' Las cantidades y condiciones deberán verificarse durante la ejecución.';
    return gasvLimit(t,100);
  }
  function gasvAddAssistant(section,title,kind){
    if(!section) return;
    const textarea=Array.from(section.querySelectorAll('textarea')).pop();
    if(!textarea) return;
    if(textarea.dataset.gasvAssistantReady==='1' && textarea.parentElement?.querySelector('.gasv-writing-assistant')) return;
    textarea.dataset.gasvAssistantReady='1';
    const existing=section.querySelector('.gasv-writing-assistant');
    if(existing) existing.remove();
    const wrap=document.createElement('div');
    wrap.className='gasv-writing-assistant print:hidden';
    wrap.dataset.gasvAssistantKind=kind;
    wrap.innerHTML=`<div class="gasv-writing-toolbar"><div><strong>${esc(title)}</strong><span data-gasv-words>0 / 100 palabras</span></div><div class="gasv-writing-actions"><button type="button" data-gasv-generate>Generar</button><button type="button" data-gasv-regenerate style="display:none">Regenerar</button><button type="button" data-gasv-clear>Limpiar</button></div></div><div class="gasv-writing-status" data-gasv-status>Generación basada únicamente en los datos registrados en la ficha.</div>`;
    const host=textarea.parentElement;

      host.insertBefore(wrap,textarea);
    }else{
      textarea.insertAdjacentElement('beforebegin',wrap);
    }
    const counter=qs('[data-gasv-words]',wrap), status=qs('[data-gasv-status]',wrap);
    const update=()=>{
      const w=gasvWords(textarea.value);
      if(counter){counter.textContent=`${w} / 100 palabras`;counter.classList.toggle('over',w>100);}
    };
    textarea.addEventListener('input',update,{passive:true}); update();
    qs('[data-gasv-clear]',wrap)?.addEventListener('click',()=>{gasvSetValue(textarea,'');status.textContent='Texto eliminado. Puede escribirlo manualmente.';update();});
    qs('[data-gasv-generate]',wrap)?.addEventListener('click',async()=>{
      const ctx=await gasvCurrentFicha();
      let txt=kind==='dim'?gasvDimensionalText():kind==='diag'?gasvDiagnosisText(ctx):gasvGeneralText(ctx);
      txt=gasvLimit(txt,100);
      gasvSetValue(textarea,txt);
      const regen=qs('[data-gasv-regenerate]',wrap); if(regen) regen.style.display='inline-flex';
      status.textContent=txt?`Texto generado con datos registrados · ${gasvWords(txt)} palabras.`:'No hay datos suficientes para generar un texto técnico.';
      update();
      scheduleEnhancements();
    });
    qs('[data-gasv-regenerate]',wrap)?.addEventListener('click',()=>qs('[data-gasv-generate]',wrap)?.click());
  }
  function ensureWritingAssistants(){
    gasvAddAssistant(gasvSection('2. Levantamiento dimensional'),'Asistente de observación dimensional','dim');
    gasvAddAssistant(gasvSection('10. Diagnóstico preliminar'),'Asistente de diagnóstico técnico','diag');
    gasvAddAssistant(gasvSection('11. Observaciones generales'),'Asistente de observaciones generales','obs');
  }

  let enhancementRaf=0;
  let enhancementTimer=0;
  function scheduleEnhancements(){
    if(enhancementRaf) cancelAnimationFrame(enhancementRaf);
    if(enhancementTimer) clearTimeout(enhancementTimer);
    enhancementRaf=requestAnimationFrame(()=>{
      enhancementTimer=setTimeout(()=>{
        enhancementTimer=0;
        ensureEnhancements();
      },120);
    });
  }

  function ensureEnhancements(){
    addMainPdfButton();
    organizeToolbar();
    ensureMainChart();
    ensureDrawerSearch();
    ensureConsolidatedChart();
    ensureWritingAssistants();
  }

  const observer=new MutationObserver(()=>{scheduleEnhancements()});
  function boot(){
    if(window[ENH]) return;
    window[ENH]={version:'4.0.0',readState,groupAreas,openPdfSelector,generateTechnicalPdf};
    ensureEnhancements();
    observer.observe(document.body,{childList:true,subtree:true});
    window.addEventListener('resize',scheduleEnhancements,{passive:true});
    window.addEventListener('scroll',scheduleEnhancements,{passive:true});
    document.addEventListener('input',e=>{
      if(e.target && e.target.matches && e.target.matches('input,select,textarea')) scheduleEnhancements();
    },true);
    document.addEventListener('change',e=>{
      if(e.target && e.target.matches && e.target.matches('input,select,textarea')) scheduleEnhancements();
    },true);
    document.addEventListener('click',e=>{
      if(e.target.closest('[data-pdf-close]') && pdfModal===e.target.closest('.gasv-enh-modal')){pdfModal.remove();pdfModal=null}
    });
    setInterval(()=>{scheduleEnhancements();},1500);
  }

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot,{once:true}); else boot();
})();
</script>

  function gasvDialog(message,isConfirm){return new Promise(res=>{const o=document.createElement('div');o.style.cssText='position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;z-index:100000;padding:16px';const b=document.createElement('div');b.setAttribute('role','dialog');b.style.cssText='background:#fff;color:#0f172a;border-radius:10px;max-width:420px;width:100%;padding:20px;font:14px/1.45 system-ui,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.3)';const p=document.createElement('p');p.style.cssText='margin:0 0 16px;white-space:pre-wrap';p.textContent=String(message??'');const row=document.createElement('div');row.style.cssText='display:flex;gap:8px;justify-content:flex-end';const done=v=>{o.remove();res(v)};const ok=document.createElement('button');ok.type='button';ok.textContent='Aceptar';ok.style.cssText='padding:8px 14px;border-radius:6px;border:0;background:#2563eb;color:#fff;font-weight:700;cursor:pointer';ok.onclick=()=>done(true);if(isConfirm){const c=document.createElement('button');c.type='button';c.textContent='Cancelar';c.style.cssText='padding:8px 14px;border-radius:6px;border:0;background:#64748b;color:#fff;font-weight:700;cursor:pointer';c.onclick=()=>done(false);row.appendChild(c)}row.appendChild(ok);b.appendChild(p);b.appendChild(row);o.appendChild(b);o.addEventListener('keydown',e=>{if(e.key==='Escape')done(false)});document.body.appendChild(o);ok.focus();});}

  function buttons(){return qsa('button').filter(b=>!b.closest('.gasv-v4-modal')&&!b.closest('.gasv-writing-assistant'))}

  function fieldSection(title){const h=qsa('h2').find(x=>norm(tx(x))===norm(title));return h?.closest('.print-card')||h?.parentElement||null}
  function fieldByLabel(section,label){if(!section)return null;const l=qsa('label',section).find(x=>norm(tx(x))===norm(label));return l?.parentElement?.querySelector('input,select,textarea')||null;}
  function setValue(el,v){if(!el)return false;const proto=el instanceof HTMLSelectElement?HTMLSelectElement.prototype:el instanceof HTMLTextAreaElement?HTMLTextAreaElement.prototype:HTMLInputElement.prototype;const setter=Object.getOwnPropertyDescriptor(proto,'value')?.set;setter?setter.call(el,String(v??'')):el.value=String(v??'');el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}));return true;}

    let max=0;
    for(const f of fichas){
      const candidates=[f?.codigo,f?.numeroFicha];
      for(const value of candidates){
        const m=String(value??'').trim().match(/^F-(\d+)$/i);
        if(m)max=Math.max(max,parseInt(m[1],10)||0);
      }
    }
    return `F-${String(max+1).padStart(3,'0')}`;
  }
  function fieldMode(){
    read().then(state=>{
      const t=dateNow();
      let next=nextFieldNumber(state.fichas);
      const html=`<div class="gasv-v4-field-intro"><b>Nueva ficha → Medir → Fotografiar → Diagnosticar → Guardar</b><span>Modo de campo compacto para teléfono. Número, fecha y hora se generan automáticamente.</span></div><div class="gasv-v4-field-grid gasv-v4-field-grid-compact"><label>Número de ficha<input data-v4-field-code value="${esc(next)}" readonly aria-readonly="true"></label><label>Fecha automática<input data-v4-field-date type="date" value="${t.date}" readonly aria-readonly="true"></label><label>Hora automática<input data-v4-field-time value="${t.time}" readonly aria-readonly="true"></label><label>Ambiente / Área<input data-v4-field-amb placeholder="Ej. Aula 01" autocomplete="off"></label></div><div class="gasv-v4-gps gasv-v4-field-statusrow"><button type="button" class="gasv-v4-btn gasv-v4-blue" data-v4-gps>Obtener ubicación</button><span data-v4-gps-status>GPS no registrado</span></div><div class="gasv-v4-field-actions gasv-v4-field-actions-compact"><button type="button" class="gasv-v4-btn gasv-v4-blue" data-v4-start>Nueva ficha</button><button type="button" class="gasv-v4-btn gasv-v4-gray" data-v4-measure>Medir</button><button type="button" class="gasv-v4-btn gasv-v4-gray" data-v4-photo>Fotografiar</button><button type="button" class="gasv-v4-btn gasv-v4-gray" data-v4-diagnose>Diagnosticar</button><button type="button" class="gasv-v4-btn gasv-v4-green" data-v4-save>Guardar</button></div><div class="gasv-v4-field-hint" data-v4-field-hint>Estado: esperando nueva ficha.</div>`;
      const m=makeModal('Trabajo de Campo · GASV V1',html,'<button type="button" class="gasv-v4-btn gasv-v4-gray" data-v4-close>Cerrar</button>');
      let gps=null;
      let started=false;
      let createdAt=t.time;
      let createdDate=t.date;

      const setHint=(text,ready=false)=>{
        const el=qs('[data-v4-field-hint]',m);
        if(el){el.textContent=text;el.classList.toggle('gasv-v4-field-ready',ready);}
      };

      const refreshNext=async()=>{
        const fresh=await read();
        next=nextFieldNumber(fresh.fichas);
        const codeEl=qs('[data-v4-field-code]',m);
        if(!started&&codeEl)codeEl.value=next;
        return next;
      };

      qsa('[data-v4-gps]',m).forEach(b=>b.addEventListener('click',()=>{
        const st=qs('[data-v4-gps-status]',m);
        if(!navigator.geolocation){st.textContent='GPS no disponible en este navegador';return}
        st.textContent='Solicitando ubicación…';
        navigator.geolocation.getCurrentPosition(pos=>{
          gps={lat:Number(pos.coords.latitude),lng:Number(pos.coords.longitude),accuracy:Number(pos.coords.accuracy||0),timestamp:new Date().toISOString()};
          st.textContent=`GPS registrado · ${gps.lat.toFixed(6)}, ${gps.lng.toFixed(6)}`;
        },err=>{
          st.textContent='GPS no registrado · '+(err.code===1?'permiso denegado':err.code===2?'ubicación no disponible':'tiempo agotado');
        },{enableHighAccuracy:true,timeout:12000,maximumAge:0});
      }));

      qs('[data-v4-start]',m)?.addEventListener('click',async()=>{
        const amb=String(qs('[data-v4-field-amb]',m)?.value||'').trim();
        if(!amb){gasvAlert('Ingrese Ambiente / Área antes de crear la ficha.');qs('[data-v4-field-amb]',m)?.focus();return}
        try{
          next=await refreshNext();
          if(!await gasvConfirm(`Crear ${next} para "${amb}"?`))return;
          const now=dateNow();
          next=await refreshNext();
          createdAt=now.time;
          createdDate=now.date;
          const nuevo=buttonByText('Nuevo');
          if(!nuevo)throw new Error('No se encontró la función Nuevo de la aplicación.');
          nuevo.click();
          setTimeout(()=>{
            const s1=fieldSection('1. Datos generales');
            setValue(fieldByLabel(s1,'Código'),next);
            setValue(fieldByLabel(s1,'Ambiente / Área'),amb);
            setValue(fieldByLabel(s1,'Fecha'),now.date);
            started=true;
            setHint(`${next} creada · ${now.date} · ${now.time}`,true);
            fieldSection('2. Levantamiento dimensional')?.scrollIntoView({behavior:'smooth',block:'start'});
          },300);
        }catch(e){gasvAlert(e.message||String(e))}
      });

      qs('[data-v4-measure]',m)?.addEventListener('click',()=>{
        if(!started){gasvAlert('Primero cree la nueva ficha.');return}
        scrollToSection('2. Levantamiento dimensional','Largo (m)');
      });

      qs('[data-v4-photo]',m)?.addEventListener('click',()=>{
        if(!started){gasvAlert('Primero cree la nueva ficha.');return}
        const sec=fieldSection('9. Registro fotográfico');
        const input=sec?.querySelector('input[type="file"]');
        if(input){
          input.setAttribute('accept','image/*');
          input.setAttribute('capture','environment');
          input.click();
        }else scrollToSection('9. Registro fotográfico');
      });

      qs('[data-v4-diagnose]',m)?.addEventListener('click',()=>{
        if(!started){gasvAlert('Primero cree la nueva ficha.');return}
        scrollToSection('10. Diagnóstico preliminar','Diagnóstico / criterio técnico');
      });

      qs('[data-v4-save]',m)?.addEventListener('click',async()=>{
        if(!started){gasvAlert('Primero cree la nueva ficha.');return}
        const saveBtn=buttonByText('Guardar');
        if(!saveBtn){gasvAlert('No se encontró la función Guardar de la aplicación.');return}
        const amb=String(qs('[data-v4-field-amb]',m)?.value||'').trim();
        setHint('Guardando ficha…');
        saveBtn.click();
        const deadline=Date.now()+6000;
        let saved=null;
        while(Date.now()<deadline){
          await new Promise(res=>setTimeout(res,250));
          try{
            const st=await read();
            saved=st.fichas.find(x=>String(x.codigo||'').trim()===next)||st.fichas.find(x=>String(x.ambiente||'').trim()===amb);
            if(saved)break;
          }catch(_){}
        }
        if(!saved){setHint('No se pudo confirmar todavía el guardado. Revise Fichas Guardadas.');return}
        try{
          const st=await read();
          const fresh={...saved,numeroFicha:next,fechaCreacion:saved.fechaCreacion||createdDate,horaCreacion:saved.horaCreacion||createdAt};
          if(!fresh.fecha)fresh.fecha=createdDate;
          if(gps)fresh.gps=gps;
          await store().setItem('fichas',st.fichas.map(x=>x.id===saved.id?fresh:x));
          setHint(`${next} guardada correctamente · ${createdDate} · ${createdAt}`,true);
          setTimeout(()=>m.remove(),450);
        }catch(e){setHint('Ficha guardada, pero no se pudo completar la metadata automática.');console.error(e)}
      });
    }).catch(e=>gasvAlert(e.message||String(e)))
  }
  async function versions(){const state=await read();const versions=state.versions||[];const rows=versions.map((v,i)=>`<tr><td>V${String(i+1).padStart(2,'0')}</td><td>${esc(v.name||'Sin nombre')}</td><td>${esc(v.createdAt||'')}</td><td>${v.fichas?.length||0}</td><td><button type="button" class="gasv-v4-small" data-v4-restore="${esc(v.id)}">Restaurar</button></td></tr>`).join('')||'<tr><td colspan="5">No existen versiones guardadas.</td></tr>';
    const html=`<p class="gasv-v4-sub">Se conservan como máximo 20 snapshots completos del proyecto.</p><div class="gasv-v4-tablewrap"><table><thead><tr><th>Versión</th><th>Nombre</th><th>Fecha</th><th>Ambientes</th><th></th></tr></thead><tbody>${rows}</tbody></table></div><div class="gasv-v4-version-actions"><input data-v4-version-name placeholder="Nombre de versión (ej. Revisión 01)"><button type="button" class="gasv-v4-btn gasv-v4-blue" data-v4-create-version>Crear versión</button></div>`;
    const m=makeModal('Versiones · GASV V1',html,'<button type="button" class="gasv-v4-btn gasv-v4-gray" data-v4-close>Cerrar</button>');
    qs('[data-v4-create-version]',m)?.addEventListener('click',async()=>{const name=String(qs('[data-v4-version-name]',m)?.value||'').trim()||`Versión ${new Date().toLocaleString('es-EC')}`;const snapshot={id:'V'+Date.now(),name,createdAt:new Date().toLocaleString('es-EC'),projectData:state.projectData,catalogosPersonalizados:state.catalogosPersonalizados,fichas:JSON.parse(JSON.stringify(state.fichas))};if((state.versions||[]).length>=20&&!(await gasvConfirm('Ya hay 20 versiones guardadas. Al crear esta, se eliminará la más antigua: "'+state.versions[state.versions.length-1].name+'". ¿Continuar?')))return;const all=[snapshot,...(state.versions||[])].slice(0,20);await store().setItem('gasvVersions',all);m.remove();versions();});
    qsa('[data-v4-restore]',m).forEach(b=>b.addEventListener('click',async()=>{const v=versions.find(x=>x.id===b.dataset.v4Restore);if(!v)return;if(!await gasvConfirm(`Restaurar ${v.name}? Se reemplazará el estado actual del proyecto.`))return;await store().setItem('fichas',JSON.parse(JSON.stringify(v.fichas||[])));await store().setItem('projectData',JSON.parse(JSON.stringify(v.projectData||{})));await store().setItem('catalogosPersonalizados',JSON.parse(JSON.stringify(v.catalogosPersonalizados||{})));location.reload();}));
  }
  async function integrity(){const s=await read(),issues=[];const ids=new Map(),codes=new Map();s.fichas.forEach((f,i)=>{const id=String(f.id||'').trim();if(!id)issues.push(`Ficha ${i+1}: sin ID.`);else ids.set(id,(ids.get(id)||0)+1);const c=String(f.codigo||'').trim();if(c)codes.set(c.toLowerCase(),(codes.get(c.toLowerCase())||0)+1);if(!c)issues.push(`${f.ambiente||`Ficha ${i+1}`}: sin código.`);if(!String(f.ambiente||'').trim())issues.push(`${c||`Ficha ${i+1}`}: sin ambiente.`);if((f.geometria==='regular' && ((f.largo && num(f.largo)<=0)||(f.ancho && num(f.ancho)<=0)))||(f.geometria==='irregular'&&f.areaDirecta&&num(f.areaDirecta)<=0))issues.push(`${c||`Ficha ${i+1}`}: dimensiones inconsistentes.`);(f.pat||[]).forEach((p,j)=>{if(!p.elemento||!p.patologia||!p.severidad)issues.push(`${c||`Ficha ${i+1}`}: patología ${j+1} incompleta.`)});(f.cuan||[]).forEach((q,j)=>{if((q.actividad||q.elemento)&&num(q.cantidad)<=0)issues.push(`${c||`Ficha ${i+1}`}: actividad ${j+1} sin cantidad válida.`)});(f.fotos||[]).forEach((ph,j)=>{if(!String(ph.desc||'').trim())issues.push(`${c||`Ficha ${i+1}`}: Foto ${j+1} sin descripción.`)});if(!String(f.diag||'').trim())issues.push(`${c||`Ficha ${i+1}`}: falta diagnóstico / criterio técnico.`);});ids.forEach((v,k)=>{if(v>1)issues.push(`ID duplicado: ${k} (${v} veces).`)});codes.forEach((v,k)=>{if(v>1)issues.push(`Código duplicado: ${k} (${v} veces).`)});
    const body=issues.length?`<div class="gasv-v4-alert">⚠ Se encontraron ${issues.length} incidencias.</div><ul class="gasv-v4-issues">${issues.slice(0,150).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:`<div class="gasv-v4-ok">✓ Integridad correcta. No se detectaron incidencias en las validaciones configuradas.</div>`;
    makeModal('Diagnóstico de integridad · GASV V1',body,'<button type="button" class="gasv-v4-btn gasv-v4-gray" data-v4-close>Cerrar</button>');
  }
  function gasvDownloadJson(obj,prefix){
    const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);const a=document.createElement('a');
    a.href=url;a.download=prefix+new Date().toISOString().slice(0,16).replace(/[^0-9]/g,'_')+'.json';
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);
  }
  async function newRelevamiento(){
    const st=store();if(!st)return gasvAlert('Almacenamiento de GASV no disponible.');
    try{
      const s=await read();
      const n=s.fichas.length;
      if(!await gasvConfirm(`Se guardará una versión con las ${n} ficha(s) actuales y se iniciará un relevamiento nuevo con la lista vacía. ¿Continuar?`))return;
      const versions=s.versions||[];
      if(versions.length>=20){
        const oldest=versions[versions.length-1];
        if(!await gasvConfirm('Ya hay 20 versiones guardadas. Al crear esta, se eliminará la más antigua: "'+oldest.name+'". ¿Continuar?'))return;
        if(await gasvConfirm('¿Descargar primero la versión "'+oldest.name+'" antes de eliminarla?'))
          gasvDownloadJson({exportedAt:new Date().toISOString(),name:oldest.name,createdAt:oldest.createdAt,projectData:oldest.projectData,catalogosPersonalizados:oldest.catalogosPersonalizados,fichas:oldest.fichas},'Version_antigua_');
      }
      const stamp=new Date().toLocaleString('es-EC');
      gasvDownloadJson({exportedAt:new Date().toISOString(),projectData:s.projectData,catalogosPersonalizados:s.catalogosPersonalizados,fichas:s.fichas},'Respaldo_Relevamiento_');
      const snapshot={id:'V'+Date.now(),name:'Relevamiento anterior · '+stamp,createdAt:stamp,projectData:s.projectData,catalogosPersonalizados:s.catalogosPersonalizados,fichas:JSON.parse(JSON.stringify(s.fichas))};
      await st.setItem('gasvVersions',[snapshot,...versions].slice(0,20));
      await st.setItem('fichas',[]);
      location.reload();
    }catch(e){gasvAlert('No se pudo iniciar el relevamiento nuevo: '+(e.message||String(e)))}
  }
  function addToolbarButtons(){const probe=buttonByText('Nuevo');const toolbar=probe?.parentElement;if(!toolbar)return;const add=(label,cls,handler,afterText)=>{if(qsa('button',toolbar).some(b=>norm(tx(b))===norm(label)))return;const b=document.createElement('button');b.type='button';b.className=`gasv-v4-toolbar-btn ${cls}`;b.textContent=label;afterText?(()=>{const ref=qsa('button',toolbar).find(x=>norm(tx(x)).startsWith(norm(afterText)));ref?ref.insertAdjacentElement('afterend',b):toolbar.appendChild(b)})():toolbar.appendChild(b);b.addEventListener('click',handler)};add('Trabajo de Campo','gasv-v4-tb-field',fieldMode,'Consolidado');add('Nuevo relevamiento','gasv-v4-tb-new',newRelevamiento);const title=qsa('h1').find(x=>norm(tx(x)).includes('relevamiento arquitectonico'));if(title&&!title.dataset.gasvV4Title){title.dataset.gasvV4Title='1';const sub=title.parentElement?.querySelector('p');if(sub&&!norm(tx(sub)).includes('v1'))sub.textContent=(tx(sub)+' · V1').trim()}}
    const CORE_BTN='flex items-center px-3 py-1.5 rounded text-sm font-semibold transition-colors';
  function toolbarEl(){const probe=buttonByText('Nuevo');return probe?.parentElement||null}
  function clearActive(){qsa('.gasv-tb-active').forEach(b=>b.classList.remove('gasv-tb-active'))}
  function setActive(btn){clearActive();btn.classList.add('gasv-tb-active')}
  function styleToolbar(){
    const toolbar=toolbarEl();if(!toolbar)return;
    qsa('button',toolbar).forEach(b=>{
      const t=norm(tx(b));
      if(t==='nuevo relevamiento'&&!b.dataset.gasvStyled){b.className='gasv-tb-btn '+CORE_BTN;b.dataset.gasvStyled='1'}
      if(t!=='nuevo relevamiento'&&!b.dataset.gasvActiveBound){
        b.dataset.gasvActiveBound='1';
        b.addEventListener('click',()=>setActive(b));
      }
    });
  }
  function bindActiveClear(){
    if(document.body.dataset.gasvActiveClear)return;
    document.body.dataset.gasvActiveClear='1';
    document.addEventListener('keydown',e=>{if(e.key==='Escape')clearActive()});
    document.addEventListener('click',e=>{const c=e.target.closest?e.target.closest('button'):null;if(c&&norm(tx(c))==='cerrar')clearActive()});
  }
  function injectToolbarCss(){
    if(document.getElementById('gasv-tb-active-css'))return;
    const st=document.createElement('style');st.id='gasv-tb-active-css';
    st.textContent='.gasv-tb-active{outline:2px solid #f59e0b!important;outline-offset:2px;background:#b45309!important;box-shadow:0 0 0 4px rgba(245,158,11,.25)!important}';
    document.head.appendChild(st);
  }
  function setupToolbar(){addToolbarButtons();styleToolbar();injectToolbarCss();bindActiveClear()}
  function boot(){setupToolbar();setTimeout(setupToolbar,500);setTimeout(setupToolbar,1500)}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();
})();
</script>
<script id="gasv-mobile-command-menu-script">
(()=>{
  'use strict';
  if(window.__GASV_MOBILE_COMMAND_MENU__) return;
  window.__GASV_MOBILE_COMMAND_MENU__=true;

  const norm=v=>String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
  const wanted=[
    'Nuevo','Guardar','Fichas Guardadas','Reporte Consolidado','Trabajo de Campo',
    'Manual','Exportar CSV','Exportar proyecto','Importar proyecto','PDF / Imprimir','Exportar PDF'
  ];
  const rank=new Map(wanted.map((x,i)=>[norm(x),i]));

  const label=b=>String(b?.innerText||b?.textContent||'').replace(/\s+/g,' ').trim();

  function isMobile(){ return window.matchMedia ? window.matchMedia('(max-width:768px)').matches : window.innerWidth<=768; }

  function findActionContainer(){
    const buttons=Array.from(document.querySelectorAll('button')).filter(b=>{
      const t=norm(label(b));
      return wanted.some(x=>t===norm(x) || (x==='Fichas Guardadas'&&t.startsWith(norm(x))) || (x==='Reporte Consolidado'&&t.startsWith(norm(x))));
    });
    const counts=new Map();
    for(const b of buttons){
      const p=b.parentElement;
      if(!p) continue;
      const n=(counts.get(p)||0)+1;
      counts.set(p,n);
    }
    let best=null,bestCount=0;
    for(const [p,n] of counts){
      if(n>bestCount && n>=4){best=p;bestCount=n;}
    }
    return best;
  }

  function findHeader(container){
    let el=container;
    for(let i=0;i<6 && el;i++,el=el.parentElement){
      const txt=norm(el.innerText||'');
      if(txt.includes('relevamiento arquitectonico') && el.querySelector?.('button')) return el;
    }
    return container?.parentElement||null;
  }

  function close(box){
    if(!box) return;
    const panel=box.querySelector('.gasv-mob-cmd-panel');
    const btn=box.querySelector('.gasv-mob-cmd-menu-btn');
    panel.hidden=true;
    btn.setAttribute('aria-expanded','false');
    btn.setAttribute('aria-label','Abrir menú de acciones');
    box.classList.remove('open');
    box.querySelector('.gasv-mob-cmd-backdrop')?.remove();
  }

  function build(){
    if(!isMobile()) return;
    const actions=findActionContainer();
    if(!actions) return;
    const header=findHeader(actions);
    if(!header) return;

    actions.classList.add('gasv-mob-cmd-actions');
    header.classList.add('gasv-mob-cmd-header');
    const brand=Array.from(header.children).find(x=>x!==actions && x.querySelector?.('img,h1'));
    brand?.classList.add('gasv-mob-cmd-brand');

    let box=header.querySelector('.gasv-mob-cmd-menu-wrap');
    if(!box){
      box=document.createElement('div');
      box.className='gasv-mob-cmd-menu-wrap';
      const btn=document.createElement('button');
      btn.type='button';
      btn.className='gasv-mob-cmd-menu-btn';
      btn.textContent='☰ MENÚ';
      btn.setAttribute('aria-label','Abrir menú de acciones');
      btn.setAttribute('aria-expanded','false');
      btn.setAttribute('aria-controls','gasv-mobile-command-panel');
      btn.setAttribute('aria-haspopup','menu');

      const panel=document.createElement('div');
      panel.id='gasv-mobile-command-panel';
      panel.className='gasv-mob-cmd-panel';
      panel.hidden=true;
      panel.setAttribute('role','menu');

      btn.addEventListener('click',e=>{
        e.stopPropagation();
        const open=panel.hidden;
        if(!open){ close(box); return; }
        panel.hidden=false;
        btn.setAttribute('aria-expanded','true');
        btn.setAttribute('aria-label','Cerrar menú de acciones');
        box.classList.add('open');
        if(!box.querySelector('.gasv-mob-cmd-backdrop')){
          const bd=document.createElement('div');
          bd.className='gasv-mob-cmd-backdrop';
          bd.addEventListener('click',()=>close(box),{once:true});
          document.body.appendChild(bd);
        }
        rebuild(panel,actions,box);
      });

      btn.addEventListener('keydown',e=>{ if(e.key==='Escape') close(box); });
      box.append(btn,panel);
      header.appendChild(box);
    }

    rebuild(box.querySelector('.gasv-mob-cmd-panel'),actions,box);
    actions.style.setProperty('display','none','important');
  }

  function rebuild(panel,actions,box){
    if(!panel||!actions) return;
    const originals=Array.from(actions.querySelectorAll(':scope > button'))
      .filter(b=>{
        const t=norm(label(b));
        return wanted.some(x=>t===norm(x) || (x==='Fichas Guardadas'&&t.startsWith(norm(x))) || (x==='Reporte Consolidado'&&t.startsWith(norm(x))));
      })
      .sort((a,b)=>(rank.get(norm(label(a)))??99)-(rank.get(norm(label(b)))??99));

    panel.innerHTML='';
    const seen=new Set();

    for(const original of originals){
      const key=norm(label(original));
      if(seen.has(key)) continue;
      seen.add(key);
      const item=document.createElement('button');
      item.type='button';
      item.className='gasv-mob-cmd-item';
      item.setAttribute('role','menuitem');
      item.setAttribute('tabindex','0');
      item.innerHTML=original.innerHTML;
      item.addEventListener('click',e=>{
        e.preventDefault();
        close(box);
        original.click();
      });
      item.addEventListener('keydown',e=>{
        if(e.key==='Enter'||e.key===' '){
          e.preventDefault();
          close(box);
          original.click();
        }
      });
      panel.appendChild(item);
    }
  }

  let timer=0;
  function run(){
    clearTimeout(timer);
    timer=setTimeout(()=>{
      try{
        if(isMobile()) build();
        else document.querySelector('.gasv-mob-cmd-menu-wrap')?.remove();
      }catch(e){}
    },120);
  }

  function boot(){
    run();
    [300,800,1500,2500,4000].forEach(ms=>setTimeout(run,ms));
    const obs=new MutationObserver(run);
    obs.observe(document.body,{childList:true,subtree:true});
    window.addEventListener('resize',run,{passive:true});
    document.addEventListener('scroll',()=>{
      const box=document.querySelector('.gasv-mob-cmd-menu-wrap.open');
      if(box) close(box);
    },{passive:true});
    document.addEventListener('keydown',e=>{
      if(e.key==='Escape') close(document.querySelector('.gasv-mob-cmd-menu-wrap'));
    });
  }

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot,{once:true});
  else boot();
})();
