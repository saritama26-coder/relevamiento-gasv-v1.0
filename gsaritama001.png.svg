<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" width="100%" height="100%">
  <!-- White Background to preserve pure contrast and crisp black rendering -->
  <rect x="0" y="0" width="1000" height="230" fill="#ffffff" />

  <!-- Outer Architectural Framing Box -->
  <rect x="10" y="10" width="980" height="210" fill="none" stroke="#000000" stroke-width="10" stroke-linejoin="miter" />

  <!-- Continuous Horizontal Axis Baseline -->
  <line x1="108" y1="128" x2="985" y2="128" stroke="#000000" stroke-width="6.5" stroke-linecap="square" />

  <!-- ==================== LETTER 'G' ==================== -->
  <g id="letter-G">
    <!-- Solid black crescent on the left cutoff by vertical line -->
    <path d="M 94 40
             A 88 88 0 0 0 94 216
             Z"
          fill="#000000" />
    
    <!-- Outer upper circular arc -->
    <path d="M 94 40
             A 88 88 0 0 1 188 40"
          fill="none"
          stroke="#000000"
          stroke-width="14"
          stroke-linecap="square" />

    <!-- Outer lower circular arc -->
    <path d="M 94 216
             A 88 88 0 0 0 188 216"
          fill="none"
          stroke="#000000"
          stroke-width="14"
          stroke-linecap="square" />

    <!-- Vertical cutoff chord -->
    <line x1="94" y1="36" x2="94" y2="220" stroke="#000000" stroke-width="6" />

    <!-- Horizontal inner spur / bar -->
    <line x1="94" y1="128" x2="160" y2="128" stroke="#000000" stroke-width="6.5" />
  </g>

  <!-- ==================== LETTER 'S' ==================== -->
  <!-- Bold classical Serif S overlapping the G -->
  <g id="letter-S">
    <path d="M 285 40
             C 246 38, 194 50, 188 80
             C 183 106, 206 118, 234 124
             C 268 132, 294 138, 294 162
             C 294 184, 268 198, 236 198
             C 202 198, 172 184, 164 160
             L 138 164
             C 146 200, 186 220, 236 220
             C 290 220, 322 192, 322 156
             C 322 126, 294 112, 262 105
             C 232 98, 214 91, 214 74
             C 214 58, 232 54, 254 54
             C 280 54, 304 65, 310 85
             L 336 78
             C 326 48, 298 40, 285 40 Z"
          fill="#000000" />
  </g>

  <!-- ==================== LETTER 'A' (SARITAMA 1) ==================== -->
  <!-- Classical A with thin left diagonal, thick right stroke and top serif -->
  <g id="letter-A1" transform="translate(328, 44)">
    <!-- Main Apex and legs -->
    <path d="M 44 0 L 6 154 L 24 154 L 36 102 L 78 102 L 90 154 L 108 154 Z
             M 56 28 L 70 84 L 42 84 Z"
          fill="#000000" />
    <!-- Bottom foot serifs -->
    <rect x="0" y="148" width="32" height="6" fill="#000000" />
    <rect x="82" y="148" width="34" height="6" fill="#000000" />
    <!-- Apex serif -->
    <rect x="34" y="0" width="22" height="5" fill="#000000" />
  </g>

  <!-- ==================== LETTER 'R' ==================== -->
  <!-- Solid black thick stem, outline upper bowl, curved leg -->
  <g id="letter-R" transform="translate(432, 44)">
    <!-- Thick solid rectangular stem -->
    <rect x="14" y="0" width="28" height="154" fill="#000000" />
    <!-- Upper loop outline -->
    <path d="M 42 0 L 70 0
             C 96 0, 114 16, 114 46
             C 114 76, 96 88, 70 88
             L 42 88 Z
             M 42 16 L 68 16
             C 84 16, 96 26, 96 46
             C 96 66, 84 72, 68 72
             L 42 72 Z"
          fill="#000000" />
    <!-- Curved leg -->
    <path d="M 64 84 L 98 154 L 126 154 L 88 80 Z" fill="#000000" />
    <!-- Top & bottom serifs on stem -->
    <rect x="2" y="0" width="44" height="6" fill="#000000" />
    <rect x="2" y="148" width="44" height="6" fill="#000000" />
  </g>

  <!-- ==================== LETTER 'I' ==================== -->
  <!-- Solid black thick architectural column -->
  <g id="letter-I" transform="translate(546, 44)">
    <rect x="20" y="0" width="30" height="154" fill="#000000" />
    <rect x="2" y="0" width="66" height="6" fill="#000000" />
    <rect x="2" y="148" width="66" height="6" fill="#000000" />
  </g>

  <!-- ==================== LETTER 'T' ==================== -->
  <!-- Solid black thick vertical stem, top crossbar with small end brackets -->
  <g id="letter-T" transform="translate(612, 44)">
    <rect x="28" y="0" width="30" height="154" fill="#000000" />
    <!-- Top crossbar -->
    <rect x="0" y="0" width="86" height="16" fill="#000000" />
    <!-- Downward end serifs -->
    <rect x="0" y="14" width="8" height="10" fill="#000000" />
    <rect x="78" y="14" width="8" height="10" fill="#000000" />
    <!-- Bottom serif on stem -->
    <rect x="14" y="148" width="58" height="6" fill="#000000" />
  </g>

  <!-- ==================== ARCHITECT'S COMPASS (Shared 'A') ==================== -->
  <!-- Forms the 'A' of SARITAMA above the line, and the 'A' of ARQ. below the line -->
  <g id="compass" transform="translate(694, 14)">
    <!-- Top knurled handle pin -->
    <line x1="0" y1="0" x2="0" y2="38" stroke="#000000" stroke-width="5" stroke-linecap="round" />
    
    <!-- Circular Reticle / Mira Telescópica -->
    <circle cx="0" cy="48" r="30" fill="none" stroke="#000000" stroke-width="5.5" />
    <circle cx="0" cy="48" r="14" fill="none" stroke="#000000" stroke-width="3.5" />
    <!-- Crosshairs (+) -->
    <line x1="-38" y1="48" x2="38" y2="48" stroke="#000000" stroke-width="4" />
    <line x1="0" y1="10" x2="0" y2="86" stroke="#000000" stroke-width="4" />
    <circle cx="0" cy="48" r="5" fill="#000000" />

    <!-- Left Compass Leg -->
    <path d="M -7 56 
             L -62 188
             L -44 190
             L 0 72 Z" 
          fill="#000000" />

    <!-- Right Compass Leg -->
    <path d="M 7 56 
             L 62 188
             L 44 190
             L 0 72 Z" 
          fill="#000000" />

    <!-- Needle Points -->
    <polygon points="-58,188 -62,188 -54,206" fill="#000000" />
    <polygon points="58,188 62,188 54,206" fill="#000000" />

    <!-- Precision horizontal drafting screw & center thumbscrew knob -->
    <rect x="-34" y="110" width="68" height="9" rx="3" fill="#000000" />
    <!-- Center hanging knurled cylindrical knob -->
    <rect x="-5" y="119" width="10" height="24" rx="2" fill="#000000" />
  </g>

  <!-- ==================== LETTER 'M' (Top Right) ==================== -->
  <g id="letter-M" transform="translate(760, 44)">
    <path d="M 0 0 L 28 0 L 54 78 L 80 0 L 108 0 L 108 84 L 88 84 L 88 28 L 64 84 L 44 84 L 20 28 L 20 84 L 0 84 Z"
          fill="#000000" />
  </g>

  <!-- ==================== LETTER 'A' (Top Right) ==================== -->
  <g id="letter-A2" transform="translate(876, 44)">
    <path d="M 40 0 L 8 84 L 24 84 L 32 60 L 68 60 L 76 84 L 92 84 Z
             M 50 14 L 64 50 L 36 50 Z"
          fill="#000000" />
    <rect x="0" y="80" width="28" height="4" fill="#000000" />
    <rect x="72" y="80" width="26" height="4" fill="#000000" />
  </g>

  <!-- ==================== 'ARQ.' (Bottom Right) ==================== -->
  <!-- 'A' is the bottom legs of the compass -->
  <!-- 'R' under the M -->
  <g id="letter-R-sub" transform="translate(770, 134)">
    <!-- Solid vertical stem -->
    <rect x="10" y="0" width="20" height="66" fill="#000000" />
    <!-- Upper loop -->
    <path d="M 30 0 L 52 0
             C 66 0, 76 8, 76 21
             C 76 34, 66 40, 52 40
             L 30 40 Z
             M 30 12 L 48 12
             C 56 12, 60 16, 60 21
             C 60 26, 56 29, 48 29
             L 30 29 Z"
          fill="#000000" />
    <!-- Diagonal curved tail -->
    <path d="M 44 38 L 70 66 L 86 66 L 58 35 Z" fill="#000000" />
    <!-- Bottom serif on stem -->
    <rect x="2" y="60" width="32" height="6" fill="#000000" />
  </g>

  <!-- 'Q.' under the A -->
  <g id="letter-Q-sub" transform="translate(862, 132)">
    <!-- Main circular ring of Q -->
    <path d="M 42 0
             C 18 0, 0 16, 0 35
             C 0 54, 18 70, 42 70
             C 66 70, 84 54, 84 35
             C 84 16, 66 0, 42 0 Z
             M 42 13
             C 56 13, 66 23, 66 35
             C 66 47, 56 57, 42 57
             C 28 57, 18 47, 18 35
             C 18 23, 28 13, 42 13 Z"
          fill="#000000" />
    <!-- Sweeping tail of Q -->
    <path d="M 52 48
             C 62 48, 74 58, 88 68
             C 98 74, 105 78, 110 80
             C 105 82, 90 80, 76 70
             C 66 62, 56 56, 52 48 Z"
          fill="#000000" />
    <!-- Period dot '.' -->
    <circle cx="120" cy="64" r="6" fill="#000000" />
  </g>
</svg>
