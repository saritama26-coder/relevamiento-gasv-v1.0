name: CI Build & Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install dependencies
      run: npm install --legacy-peer-deps

    - name: Type check & Lint
      run: npm run lint

    - name: Prepare React/Vite entry point
      run: cp index.vite.html index.html

    - name: Build production bundle
      run: npm run build

    - name: Build standalone single-file HTML
      run: npm run build:standalone

    - name: Upload standalone HTML artifact
      uses: actions/upload-artifact@v4
      with:
        name: relevamiento-gasv-standalone-html
        path: dist/Relevamiento_Arquitectonico_GASV_autonomo.html
        if-no-files-found: error
        retention-days: 14
