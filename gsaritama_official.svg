<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 230" width="100%" height="100%">
  <!-- Pure White Background -->
  <rect x="0" y="0" width="1020" height="230" fill="#ffffff" />

  <!-- Outer Rectangular Frame: Exact heavy architectural black border -->
  <rect x="14" y="14" width="992" height="202" fill="none" stroke="#000000" stroke-width="12" stroke-linejoin="miter" />

  <!-- Continuous Horizontal Axis Baseline intersecting all letters -->
  <line x1="126" y1="126" x2="985" y2="126" stroke="#000000" stroke-width="6.5" stroke-linecap="square" />

  <!-- ==================== LETTER 'G' ==================== -->
  <g id="letter-G">
    <!-- Solid black crescent on the left chord -->
    <path d="M 126 42
             A 84 84 0 0 0 126 210
             Z"
          fill="#000000" />
    
    <!-- Outer upper circular arc extending right -->
    <path d="M 126 42
             A 84 84 0 0 1 204 42"
          fill="none"
          stroke="#000000"
          stroke-width="15"
          stroke-linecap="square" />

    <!-- Outer lower circular arc extending right -->
    <path d="M 126 210
             A 84 84 0 0 0 204 210"
          fill="none"
          stroke="#000000"
          stroke-width="15"
          stroke-linecap="square" />

    <!-- Vertical boundary line of the chord -->
    <line x1="126" y1="36" x2="126" y2="216" stroke="#000000" stroke-width="6" />

    <!-- Inner horizontal spur extending into the center -->
    <line x1="126" y1="126" x2="182" y2="126" stroke="#000000" stroke-width="6.5" />
  </g>

  <!-- ==================== LETTER 'S' ==================== -->
  <g id="letter-S">
    <path d="M 288 42
             C 252 40, 204 52, 198 80
             C 193 106, 216 118, 242 124
             C 276 132, 300 138, 300 160
             C 300 182, 274 196, 244 196
             C 212 196, 184 183, 176 160
             L 150 164
             C 158 200, 196 218, 244 218
             C 296 218, 328 192, 328 156
             C 328 126, 300 112, 270 105
             C 242 98, 224 91, 224 75
             C 224 60, 242 55, 262 55
             C 288 55, 310 66, 316 85
             L 342 79
             C 332 49, 302 42, 288 42 Z"
          fill="#000000" />
  </g>

  <!-- ==================== LETTER 'A' (SARITAMA) ==================== -->
  <!-- Outline Apex with solid diagonal and base serifs resting exactly on axis line -->
  <g id="letter-A1" transform="translate(336, 46)">
    <path d="M 44 0 L 8 80 L 24 80 L 34 54 L 66 54 L 76 80 L 96 80 Z
             M 48 16 L 60 42 L 38 42 Z"
          fill="#000000" />
    <rect x="0" y="76" width="30" height="4" fill="#000000" />
    <rect x="72" y="76" width="28" height="4" fill="#000000" />
    <rect x="34" y="0" width="20" height="4" fill="#000000" />
  </g>

  <!-- ==================== LETTER 'R' ==================== -->
  <!-- Classical R above and resting on axis line -->
  <g id="letter-R" transform="translate(442, 46)">
    <rect x="10" y="0" width="22" height="80" fill="#000000" />
    <path d="M 32 0 L 62 0
             C 86 0, 100 12, 100 36
             C 100 60, 86 70, 62 70
             L 32 70 Z
             M 32 14 L 60 14
             C 74 14, 82 22, 82 36
             C 82 50, 74 56, 60 56
             L 32 56 Z"
          fill="#000000" />
    <path d="M 54 66 L 86 122 L 110 122 L 74 62 Z" fill="#000000" />
    <rect x="0" y="0" width="36" height="5" fill="#000000" />
    <rect x="0" y="76" width="36" height="4" fill="#000000" />
    <rect x="80" y="118" width="34" height="4" fill="#000000" />
  </g>

  <!-- ==================== LETTER 'I' ==================== -->
  <g id="letter-I" transform="translate(556, 46)">
    <rect x="18" y="0" width="28" height="80" fill="#000000" />
    <rect x="2" y="0" width="60" height="5" fill="#000000" />
    <rect x="2" y="76" width="60" height="4" fill="#000000" />
  </g>

  <!-- ==================== LETTER 'T' ==================== -->
  <g id="letter-T" transform="translate(620, 46)">
    <rect x="26" y="0" width="28" height="80" fill="#000000" />
    <rect x="0" y="0" width="80" height="15" fill="#000000" />
    <rect x="0" y="13" width="8" height="9" fill="#000000" />
    <rect x="72" y="13" width="8" height="9" fill="#000000" />
    <rect x="12" y="76" width="54" height="4" fill="#000000" />
  </g>

  <!-- ==================== ARCHITECT'S COMPASS (Forms 'A' of SARITAMA and 'A' of ARQ.) ==================== -->
  <g id="compass" transform="translate(696, 16)">
    <!-- Top knurled pin handle -->
    <line x1="0" y1="0" x2="0" y2="36" stroke="#000000" stroke-width="4.5" stroke-linecap="round" />
    
    <!-- Circular Reticle / Mira telescópica con mira (+) -->
    <circle cx="0" cy="46" r="29" fill="none" stroke="#000000" stroke-width="5" />
    <circle cx="0" cy="46" r="14" fill="none" stroke="#000000" stroke-width="3" />
    <line x1="-36" y1="46" x2="36" y2="46" stroke="#000000" stroke-width="3.5" />
    <line x1="0" y1="10" x2="0" y2="82" stroke="#000000" stroke-width="3.5" />
    <circle cx="0" cy="46" r="4.5" fill="#000000" />

    <!-- Left Leg -->
    <path d="M -6 54 
             L -58 182
             L -42 184
             L 0 70 Z" 
          fill="#000000" />

    <!-- Right Leg -->
    <path d="M 6 54 
             L 58 182
             L 42 184
             L 0 70 Z" 
          fill="#000000" />

    <!-- Needle Tips -->
    <polygon points="-54,182 -58,182 -50,198" fill="#000000" />
    <polygon points="54,182 58,182 50,198" fill="#000000" />

    <!-- Thumbscrew adjustment mechanism -->
    <rect x="-32" y="106" width="64" height="9" rx="3" fill="#000000" />
    <rect x="-4.5" y="115" width="9" height="22" rx="2" fill="#000000" />
  </g>

  <!-- ==================== LETTER 'M' (Top Right) ==================== -->
  <g id="letter-M" transform="translate(762, 46)">
    <path d="M 0 0 L 26 0 L 52 74 L 78 0 L 104 0 L 104 80 L 84 80 L 84 26 L 62 78 L 42 78 L 20 26 L 20 80 L 0 80 Z"
          fill="#000000" />
  </g>

  <!-- ==================== LETTER 'A' (Top Right) ==================== -->
  <g id="letter-A2" transform="translate(874, 46)">
    <path d="M 38 0 L 8 80 L 24 80 L 32 58 L 66 58 L 74 80 L 90 80 Z
             M 48 14 L 60 48 L 36 48 Z"
          fill="#000000" />
    <rect x="0" y="76" width="26" height="4" fill="#000000" />
    <rect x="70" y="76" width="26" height="4" fill="#000000" />
  </g>

  <!-- ==================== 'ARQ.' (Bottom Right) ==================== -->
  <!-- 'R' under the M -->
  <g id="letter-R-sub" transform="translate(772, 134)">
    <rect x="8" y="0" width="18" height="64" fill="#000000" />
    <path d="M 26 0 L 48 0
             C 62 0, 72 7, 72 20
             C 72 33, 62 39, 48 39
             L 26 39 Z
             M 26 11 L 44 11
             C 52 11, 56 15, 56 20
             C 56 25, 52 28, 44 28
             L 26 28 Z"
          fill="#000000" />
    <path d="M 40 36 L 66 64 L 82 64 L 54 33 Z" fill="#000000" />
    <rect x="0" y="58" width="28" height="6" fill="#000000" />
  </g>

  <!-- 'Q.' under the A -->
  <g id="letter-Q-sub" transform="translate(862, 132)">
    <!-- Main circular ring of Q -->
    <path d="M 38 0
             C 16 0, 0 15, 0 33
             C 0 51, 16 66, 38 66
             C 60 66, 76 51, 76 33
             C 76 15, 60 0, 38 0 Z
             M 38 12
             C 50 12, 59 21, 59 33
             C 59 45, 50 54, 38 54
             C 26 54, 17 45, 17 33
             C 17 21, 26 12, 38 12 Z"
          fill="#000000" />
    <!-- Sweeping tail of Q -->
    <path d="M 46 44
             C 56 44, 66 54, 78 64
             C 86 69, 93 73, 98 75
             C 93 77, 80 75, 68 66
             C 60 58, 50 52, 46 44 Z"
          fill="#000000" />
    <!-- Period dot '.' -->
    <circle cx="106" cy="60" r="5.5" fill="#000000" />
  </g>
</svg>
